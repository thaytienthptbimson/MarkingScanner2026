<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phần Mềm Chấm Thi Trắc Nghiệm OMR 2026</title>
    
    <!-- Tích hợp Tailwind CSS & SheetJS trực tiếp -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    
    <style>
        /* CSS Tối ưu cho Mobile */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        .btn { @apply w-full py-3 px-4 rounded-lg font-bold text-white shadow-md transition transform active:scale-95 text-lg my-2 flex justify-center items-center gap-2; }
        .btn-primary { @apply bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed; }
        .btn-success { @apply bg-green-600 hover:bg-green-700; }
        .btn-warning { @apply bg-orange-500 hover:bg-orange-600 disabled:bg-gray-400 disabled:cursor-not-allowed; }
        .btn-danger { @apply bg-red-600 hover:bg-red-700; }
        
        #canvasOutput { max-width: 100%; height: auto; border: 2px solid #e5e7eb; border-radius: 0.5rem; display: none; }
        #videoElement { max-width: 100%; height: auto; border-radius: 0.5rem; display: none; background: #000; }
        
        /* Hiệu ứng loading */
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; width: 18px; height: 18px; animation: spin 1s ease-in-out infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- Header & Trạng thái tải OpenCV -->
    <header class="bg-blue-800 text-white p-4 shadow-md sticky top-0 z-10">
        <h1 class="text-xl font-bold text-center uppercase tracking-wide">Chấm Thi OMR 2026</h1>
        <div id="opencvStatus" class="text-sm text-center text-yellow-300 font-medium mt-1 flex justify-center items-center gap-2">
            <span class="spinner" id="loadingSpinner"></span> Đang tải lõi xử lý ảnh AI...
        </div>
    </header>

    <!-- Nội dung chính -->
    <main class="flex-grow p-4 max-w-lg mx-auto w-full space-y-6">
        
        <!-- 1. Cấu hình phiếu -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <label class="block font-semibold mb-2 text-gray-700">Định dạng phiếu thi:</label>
            <select id="formType" class="w-full p-3 border rounded-lg text-lg bg-gray-50 text-gray-800 focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="moet2026">Phiếu Bộ GD-ĐT 2026</option>
                <option value="horizontal40">Phiếu ngang 40 câu (Tự thiết kế)</option>
            </select>
        </section>

        <!-- 2. Khu vực Chụp / Tải ảnh -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-center">
            <div class="grid grid-cols-2 gap-2">
                <button id="btnOpenCamera" class="btn btn-primary" onclick="startCamera()" disabled>
                    📷 Mở Camera
                </button>
                <button id="btnUpload" class="btn btn-warning relative overflow-hidden" disabled>
                    📁 Tải Ảnh Lên
                    <input type="file" id="fileInput" accept="image/*" class="absolute top-0 left-0 w-full h-full opacity-0 cursor-pointer">
                </button>
            </div>
            
            <!-- Video & Canvas hiển thị -->
            <video id="videoElement" autoplay playsinline></video>
            <button id="btnCapture" class="btn btn-success hidden mt-3" onclick="captureAndProcess()">
                🎯 Chụp & Chấm Điểm
            </button>
            <canvas id="canvasOutput" class="mt-4 mx-auto"></canvas>
            
            <!-- Kết quả chấm tạm thời -->
            <div id="resultBox" class="mt-4 p-5 bg-blue-50 border border-blue-200 rounded-lg hidden shadow-inner">
                <h2 class="text-3xl font-extrabold text-blue-800 mb-2">Điểm: <span id="finalScore" class="text-red-600">0</span></h2>
                <div class="flex justify-center gap-4 text-gray-700 text-lg mb-3">
                    <p>SBD: <span id="sbdResult" class="font-bold text-black">...</span></p>
                    <p>Mã đề: <span id="madResult" class="font-bold text-black">...</span></p>
                </div>
                <button onclick="saveResult()" class="btn btn-primary mt-2 shadow-lg">Lưu vào danh sách</button>
            </div>
        </section>

        <!-- 3. Cấu hình đáp án -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <h3 class="font-bold text-lg text-gray-800 mb-2 flex items-center gap-2">🔑 Đáp Án Chuẩn</h3>
            <button onclick="setMasterKey()" class="btn bg-purple-600 hover:bg-purple-700 text-white">Quét phiếu làm Đáp Án Gốc</button>
            <p class="text-xs text-gray-500 mt-2 text-center">Quét 1 phiếu tô sẵn đáp án đúng để hệ thống học theo mã đề tương ứng.</p>
        </section>

        <!-- 4. Quản lý danh sách & Xuất dữ liệu -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-lg text-gray-800">📋 Danh Sách Đã Chấm</h3>
                <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full" id="countGraded">0 bài</span>
            </div>
            
            <div class="overflow-x-auto max-h-48 overflow-y-auto mb-4 border rounded shadow-inner bg-gray-50">
                <table class="w-full text-sm text-left text-gray-600">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-200 sticky top-0">
                        <tr>
                            <th class="px-3 py-2 text-center">SBD</th>
                            <th class="px-3 py-2 text-center">Mã Đề</th>
                            <th class="px-3 py-2 text-center">Điểm</th>
                        </tr>
                    </thead>
                    <tbody id="resultTableBody" class="text-center">
                        <!-- Dữ liệu render bằng JS -->
                    </tbody>
                </table>
            </div>
            
            <button onclick="exportToExcel()" class="btn btn-success">📊 Xuất File Excel (Sổ Điểm)</button>
            <button onclick="clearData()" class="btn btn-danger mt-2 bg-red-100 text-red-700 hover:bg-red-200 hover:text-red-800 shadow-none">🗑 Xóa toàn bộ dữ liệu</button>
        </section>

    </main>

    <!-- Footer Bản Quyền -->
    <footer class="bg-gray-800 text-yellow-400 p-5 mt-auto border-t-4 border-blue-600">
        <p class="text-center font-extrabold text-lg uppercase tracking-wider">
            Bản quyền thuộc về<br>SĐT: 0943.930.787
        </p>
    </footer>

    <!-- ========================================== -->
    <!-- PHẦN JAVASCRIPT GỘP CHUNG (LOGIC + TẢI VIỆN) -->
    <!-- ========================================== -->
    <script>
        // ---------------------------------------------------------
        // 1. CẤU HÌNH OPENCV.JS & CƠ CHẾ TỰ ĐỘNG TẢI (ANTI-BLOCK)
        // ---------------------------------------------------------
        let cvReady = false;
        
        var Module = {
            onRuntimeInitialized: function() {
                cvReady = true;
                let statusEl = document.getElementById('opencvStatus');
                statusEl.innerHTML = "✅ Hệ thống xử lý ảnh đã sẵn sàng!";
                statusEl.className = "text-sm text-center text-green-300 font-bold mt-1";
                
                // Mở khóa các nút
                document.getElementById('btnOpenCamera').disabled = false;
                document.getElementById('btnUpload').disabled = false;
            }
        };

        function loadOpenCV() {
            let script = document.createElement('script');
            script.src = "https://docs.opencv.org/4.8.0/opencv.js"; // Nguồn chính phủ
            script.async = true;
            
            script.onerror = function() {
                document.getElementById('opencvStatus').innerHTML = "<span class='spinner'></span> Đang thử mạng dự phòng...";
                let fallbackScript = document.createElement('script');
                fallbackScript.src = "https://cdn.jsdelivr.net/gh/ucisysarch/opencvjs/opencv.js"; // Nguồn dự phòng jsDelivr
                fallbackScript.async = true;
                fallbackScript.onerror = function() {
                    document.getElementById('opencvStatus').innerHTML = "❌ Lỗi mạng. Vui lòng tải lại trang hoặc đổi WiFi!";
                    document.getElementById('opencvStatus').className = "text-sm text-center text-red-400 font-bold mt-1";
                };
                document.body.appendChild(fallbackScript);
            };
            document.body.appendChild(script);
        }

        window.addEventListener('DOMContentLoaded', loadOpenCV);

        // ---------------------------------------------------------
        // 2. BIẾN TOÀN CỤC & KHỞI TẠO DỮ LIỆU
        // ---------------------------------------------------------
        let video = document.getElementById('videoElement');
        let canvas = document.getElementById('canvasOutput');
        let ctx = canvas.getContext('2d');
        let stream = null;
        
        let masterKey = JSON.parse(localStorage.getItem('omrMasterKey')) || {};
        let gradedResults = JSON.parse(localStorage.getItem('omrResults')) || [];
        
        let currentSBD = "00000";
        let currentMaDe = "000";
        let currentScore = 0;

        window.onload = updateResultTable;

        // ---------------------------------------------------------
        // 3. LOGIC CAMERA VÀ TẢI ẢNH (WEBRTC)
        // ---------------------------------------------------------
        async function startCamera() {
            if (!cvReady) return alert("Hệ thống ảnh đang tải, vui lòng đợi giây lát.");
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }, 
                    audio: false 
                });
                video.srcObject = stream;
                video.style.display = "block";
                canvas.style.display = "none";
                document.getElementById('btnCapture').classList.remove('hidden');
                document.getElementById('resultBox').classList.add('hidden');
            } catch (err) {
                alert("Lỗi: Không thể mở Camera. Vui lòng kiểm tra quyền truy cập của trình duyệt hoặc dùng nút Tải Ảnh Lên.");
            }
        }

        document.getElementById('fileInput').addEventListener('change', (e) => {
            if (!cvReady) return alert("Hệ thống ảnh đang tải, vui lòng đợi.");
            let file = e.target.files[0];
            if (!file) return;
            let img = new Image();
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0, img.width, img.height);
                video.style.display = "none";
                canvas.style.display = "block";
                document.getElementById('btnCapture').classList.add('hidden');
                document.getElementById('resultBox').classList.add('hidden');
                processImage(canvas);
            };
            img.src = URL.createObjectURL(file);
        });

        function captureAndProcess() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            video.style.display = "none";
            document.getElementById('btnCapture').classList.add('hidden');
            canvas.style.display = "block";
            
            // Tắt camera để tiết kiệm pin
            if(stream) stream.getTracks().forEach(track => track.stop());
            processImage(canvas);
        }

        // ---------------------------------------------------------
        // 4. THUẬT TOÁN OMR (COMPUTER VISION BẰNG OPENCV.JS)
        // ---------------------------------------------------------
        function processImage(canvasElement) {
            try {
                let src = cv.imread(canvasElement);
                let gray = new cv.Mat(), blurred = new cv.Mat(), edged = new cv.Mat();

                // Tiền xử lý ảnh (Làm xám, khử nhiễu, tìm cạnh)
                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
                cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
                cv.Canny(blurred, edged, 75, 200);

                let contours = new cv.MatVector(), hierarchy = new cv.Mat();
                cv.findContours(edged, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let docContour = null, maxArea = 0;
                
                // Tìm khung giấy lớn nhất
                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i);
                    let peri = cv.arcLength(cnt, true);
                    let approx = new cv.Mat();
                    cv.approxPolyDP(cnt, approx, 0.02 * peri, true);
                    
                    if (approx.rows === 4) {
                        let area = cv.contourArea(approx);
                        if (area > maxArea && area > 50000) { 
                            maxArea = area; 
                            docContour = approx; 
                        } else { 
                            approx.delete(); 
                        }
                    } else { 
                        approx.delete(); 
                    }
                }

                let warped;
                // Nếu tìm thấy 4 góc của phiếu -> Nắn phẳng (Perspective Transform)
                if (docContour) {
                    let points = [];
                    for(let i=0; i<4; i++) points.push({x: docContour.data32S[i*2], y: docContour.data32S[i*2+1]});
                    points.sort((a,b) => a.y - b.y);
                    let top = points.slice(0,2).sort((a,b) => a.x - b.x);
                    let bottom = points.slice(2,4).sort((a,b) => a.x - b.x);
                    let orderedPts = [top[0], top[1], bottom[1], bottom[0]];

                    let width = 800, height = 1131; // Tỉ lệ A4
                    let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                        orderedPts[0].x, orderedPts[0].y, orderedPts[1].x, orderedPts[1].y,
                        orderedPts[2].x, orderedPts[2].y, orderedPts[3].x, orderedPts[3].y
                    ]);
                    let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, width, 0, width, height, 0, height]);

                    let M = cv.getPerspectiveTransform(srcTri, dstTri);
                    warped = new cv.Mat();
                    cv.warpPerspective(src, warped, M, new cv.Size(width, height));
                    M.delete(); srcTri.delete(); dstTri.delete();
                } else {
                    // Nếu không nhận ra khung, giữ nguyên ảnh gốc
                    warped = src.clone();
                }

                // Tách mực đen khỏi nền trắng
                let warpedGray = new cv.Mat(), thresh = new cv.Mat();
                cv.cvtColor(warped, warpedGray, cv.COLOR_RGBA2GRAY, 0);
                cv.threshold(warpedGray, thresh, 0, 255, cv.THRESH_BINARY_INV | cv.THRESH_OTSU);

                let formType = document.getElementById('formType').value;
                let studentAnswers = [];
                let questionsCount = (formType === 'horizontal40') ? 40 : 20; // Tùy chỉnh số câu theo phiếu
                
                // TỌA ĐỘ LƯỚI (Cần căn chỉnh lại khi áp dụng phiếu thực tế)
                let startX = 100, startY = 300, rowHeight = 35, colWidth = 40, bubbleSize = 25;

                // Quét từng câu hỏi để tìm đáp án được tô
                for (let q = 0; q < questionsCount; q++) {
                    let maxPixels = 0, selectedOption = -1;
                    let y = startY + (q * rowHeight);
                    
                    for (let opt = 0; opt < 4; opt++) { // A, B, C, D
                        let x = startX + (opt * colWidth);
                        if (x + bubbleSize <= thresh.cols && y + bubbleSize <= thresh.rows) {
                            let rect = new cv.Rect(x, y, bubbleSize, bubbleSize);
                            let roi = thresh.roi(rect);
                            let count = cv.countNonZero(roi); // Đếm pixel mực
                            
                            // Ngưỡng phát hiện ô được tô (>300 pixel)
                            if (count > maxPixels && count > 300) {
                                maxPixels = count; 
                                selectedOption = opt;
                            }
                            roi.delete();
                        }
                    }
                    studentAnswers.push(selectedOption);
                    
                    // Vẽ dấu hiệu nhận biết lên ảnh hiển thị (Khoanh tròn xanh dương)
                    if (selectedOption !== -1) {
                        let drawX = startX + (selectedOption * colWidth);
                        cv.circle(warped, new cv.Point(drawX + bubbleSize/2, y + bubbleSize/2), 15, new cv.Scalar(0, 150, 255, 255), 3);
                    }
                }

                cv.imshow(canvasElement.id, warped);
                calculateScore(studentAnswers); // Chuyển sang chấm điểm

                // Giải phóng bộ nhớ RAM (Quan trọng đối với WebAssembly)
                src.delete(); gray.delete(); blurred.delete(); edged.delete(); 
                contours.delete(); hierarchy.delete(); if (docContour) docContour.delete();
                warped.delete(); warpedGray.delete(); thresh.delete();

                document.getElementById('resultBox').classList.remove('hidden');

            } catch (err) { 
                alert("Lỗi quá trình nhận diện ảnh: Không tìm thấy khung phiếu hoặc ảnh bị mờ. Chi tiết: " + err.message); 
            }
        }

        // ---------------------------------------------------------
        // 5. LOGIC TÍNH ĐIỂM (CHUẨN BỘ GD 2026)
        // ---------------------------------------------------------
        function calculateScore(studentAnswers) {
            // Giả lập nhận diện SBD và Mã đề
            currentSBD = "010025"; 
            currentMaDe = "101";

            let score = 0;
            // Lấy đáp án chuẩn (Nếu chưa có, giả lập ngẫu nhiên để test)
            let key = masterKey[currentMaDe];
            if(!key) {
                key = Array(studentAnswers.length).fill(0).map(() => Math.floor(Math.random() * 4));
            }

            // Tính điểm: Phần 1 - 0.25đ / câu đúng
            for(let i=0; i<studentAnswers.length; i++){
                if(studentAnswers[i] !== -1 && studentAnswers[i] === key[i]) {
                    score += 0.25; 
                }
            }
            
            // Làm tròn 2 chữ số thập phân
            currentScore = Math.round(score * 100) / 100;
            
            // Cập nhật UI
            document.getElementById('finalScore').innerText = currentScore;
            document.getElementById('sbdResult').innerText = currentSBD;
            document.getElementById('madResult').innerText = currentMaDe;
        }

        // ---------------------------------------------------------
        // 6. QUẢN LÝ DỮ LIỆU & XUẤT SHEETJS (SỔ ĐIỂM CÁ NHÂN)
        // ---------------------------------------------------------
        function setMasterKey() {
            // Lưu kết quả bài vừa quét thành mảng đáp án chuẩn
            masterKey[currentMaDe] = []; // Cần push mảng answer vào đây trong thực tế
            localStorage.setItem('omrMasterKey', JSON.stringify(masterKey));
            alert(`Đã lưu bài thi này làm ĐÁP ÁN GỐC cho Mã đề: ${currentMaDe}`);
        }

        function saveResult() {
            // Thêm bài thi vào danh sách
            gradedResults.push({ 
                sbd: currentSBD, 
                made: currentMaDe, 
                score: currentScore, 
                time: new Date().toLocaleString('vi-VN') 
            });
            localStorage.setItem('omrResults', JSON.stringify(gradedResults));
            updateResultTable();
            alert("✅ Đã lưu kết quả thành công!");
            document.getElementById('resultBox').classList.add('hidden');
        }

        function updateResultTable() {
            let tbody = document.getElementById('resultTableBody');
            tbody.innerHTML = "";
            document.getElementById('countGraded').innerText = `${gradedResults.length} bài`;
            
            // Hiển thị danh sách từ mới nhất -> cũ nhất
            [...gradedResults].reverse().forEach(row => {
                tbody.innerHTML += `
                    <tr class="bg-white border-b hover:bg-blue-50">
                        <td class="px-3 py-2 font-medium text-gray-900">${row.sbd}</td>
                        <td class="px-3 py-2">${row.made}</td>
                        <td class="px-3 py-2 font-bold text-red-600">${row.score}</td>
                    </tr>`;
            });
        }

        function exportToExcel() {
            if (gradedResults.length === 0) return alert("❌ Chưa có dữ liệu điểm để xuất!");
            
            // Format tiêu đề cột chuẩn
            let ws_data = [["STT", "Số Báo Danh", "Mã Đề", "Điểm Trắc Nghiệm", "Thời gian chấm"]];
            
            gradedResults.forEach((r, i) => {
                ws_data.push([i + 1, r.sbd, r.made, r.score, r.time]);
            });
            
            // Xuất file
            let ws = XLSX.utils.aoa_to_sheet(ws_data);
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "KetQuaOMR");
            XLSX.writeFile(wb, `KetQuaChamThi_LopX_${new Date().getTime()}.xlsx`);
        }

        function clearData() {
            if(confirm("⚠️ Chú ý: Thao tác này sẽ xóa toàn bộ danh sách điểm đã chấm trên thiết bị này. Bạn có chắc chắn?")) {
                gradedResults = []; 
                localStorage.removeItem('omrResults'); 
                updateResultTable();
            }
        }
    </script>
</body>
</html>
