<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chấm Trắc Nghiệm OMR</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<!-- Ưu tiên file opencv.js đặt cùng thư mục (nhanh nhờ CDN của GitHub Pages); không có thì tải từ docs.opencv.org -->
<script async src="./opencv.js" onload="cvBoot()" onerror="cvCdn()"></script>
<style>.B{padding:.95rem;border-radius:.9rem;color:#fff;font-weight:700;width:100%;font-size:1rem}.I{width:100%;padding:.75rem;border:1px solid #cbd5e1;border-radius:.75rem;background:#fff}</style>
</head>
<body class="bg-slate-100 text-slate-800" style="padding-bottom:4rem">
<header class="bg-indigo-700 text-white px-4 py-3 sticky top-0 z-20 shadow">
  <h1 class="font-bold text-lg">Chấm trắc nghiệm OMR</h1>
  <p id="st" class="text-xs text-indigo-200">Đang tải OpenCV.js…</p>
</header>
<div class="max-w-xl mx-auto p-3 space-y-3">
  <select id="tpl" class="I font-semibold" onchange="renderKeys()"></select>
  <nav id="nav" class="grid grid-cols-3 gap-2"></nav>

  <!-- TAB CHẤM BÀI -->
  <section id="scan" class="space-y-3">
    <select id="mode" class="I">
      <option value="grade">Chấm bài</option>
      <option value="master">Lưu phiếu này làm đáp án chuẩn</option>
      <option value="test">Xem thử lưới (không lưu kết quả)</option>
    </select>
    <div class="grid grid-cols-2 gap-2">
      <button onclick="cam()" class="B bg-indigo-600">Mở camera</button>
      <label class="B bg-emerald-600 text-center cursor-pointer">Chọn ảnh<input type="file" accept="image/*" hidden onchange="loadFile(this.files[0]);this.value=''"></label>
    </div>
    <div id="cbox" hidden class="space-y-2">
      <video id="vid" autoplay playsinline muted class="w-full rounded-xl bg-black"></video>
      <button onclick="snap()" class="B bg-rose-600">Chụp và chấm</button>
    </div>
    <details class="bg-white rounded-xl p-3 text-sm">
      <summary class="font-semibold cursor-pointer">Hiệu chỉnh nhận dạng</summary>
      <label class="block mt-2">Ngưỡng tô (tỉ lệ điểm đen): <b id="vfill"></b>
        <input id="cfill" type="range" min="0.2" max="0.7" step="0.05" class="w-full"></label>
      <div class="grid grid-cols-2 gap-2 mt-2">
        <label>Lệch X (px)<input id="cox" type="number" class="I"></label>
        <label>Lệch Y (px)<input id="coy" type="number" class="I"></label>
      </div>
      <button onclick="last&&run(last)" class="B bg-slate-600 mt-2">Quét lại ảnh vừa rồi</button>
    </details>
    <div id="sum" class="bg-white rounded-xl p-3 shadow" hidden></div>
    <canvas id="out" class="w-full rounded-xl shadow" hidden></canvas>
  </section>

  <!-- TAB ĐÁP ÁN -->
  <section id="key" hidden class="space-y-3">
    <div class="bg-white rounded-xl p-3 space-y-2 shadow">
      <label class="block text-sm font-semibold">Mã đề<input id="kmd" class="I" inputmode="numeric" maxlength="3" placeholder="001"></label>
      <label class="block text-sm font-semibold"><span id="l1"></span><input id="k1" class="I" placeholder="ABCDABCD…"></label>
      <label id="w2" class="block text-sm font-semibold">Phần II: mỗi câu 4 ý Đ/S, cách nhau bằng dấu cách<input id="k2" class="I" placeholder="DSDS SSDD DDDS SDSD"></label>
      <label id="w3" class="block text-sm font-semibold">Phần III: các đáp án cách nhau bằng dấu cách<input id="k3" class="I" placeholder="12 -3,5 0,25 7 8 100"></label>
      <button onclick="saveKey()" class="B bg-indigo-600">Lưu đáp án</button>
      <p class="text-xs text-slate-500">Hoặc chuyển sang tab Chấm bài, chọn "Lưu phiếu này làm đáp án chuẩn" rồi quét phiếu đã tô sẵn.</p>
    </div>
    <div id="kl" class="space-y-2"></div>
  </section>

  <!-- TAB KẾT QUẢ -->
  <section id="res" hidden class="space-y-3">
    <div class="grid grid-cols-2 gap-2">
      <button onclick="exp()" class="B bg-emerald-600">Xuất file Excel</button>
      <button onclick="regrade()" class="B bg-indigo-600">Chấm lại theo đáp án</button>
    </div>
    <div id="rl" class="space-y-2"></div>
    <button onclick="if(confirm('Xóa toàn bộ kết quả?')){results=[];S('res',results);renderRes()}" class="B bg-rose-600">Xóa tất cả</button>
  </section>
</div>
<div id="toast" hidden class="fixed left-3 right-3 z-30 bg-slate-900 text-white rounded-xl p-3 text-center text-sm" style="bottom:4.5rem"></div>
<footer class="fixed bottom-0 inset-x-0 z-20 bg-indigo-800 text-yellow-300 text-center font-bold py-3 px-2 text-sm shadow-[0_-2px_8px_rgba(0,0,0,.25)]" style="padding-bottom:calc(.75rem + env(safe-area-inset-bottom))">Bản quyền thuộc về số ĐT: 0943.930.787</footer>

<script>
/* ============ 0. TIỆN ÍCH & TRẠNG THÁI ============ */
const $=s=>document.querySelector(s);
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem('omr_'+k))??d}catch{return d}};
const S=(k,v)=>localStorage.setItem('omr_'+k,JSON.stringify(v));
let ready=false,last=null,stream=null;
let keys=L('keys',{}),results=L('res',[]),cfg=L('cfg',{fill:.4,ox:0,oy:0});
const toast=m=>{const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,4000)};
function cvCdn(){const s=document.createElement('script');s.async=true;s.src='https://docs.opencv.org/4.9.0/opencv.js';s.onload=cvBoot;document.head.append(s)}
// Service Worker: lưu cache opencv.js, Tailwind, SheetJS để các lần mở sau gần như tức thì và chạy được khi mất mạng
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
function cvBoot(){
  const up=()=>{ready=true;$('#st').textContent='OpenCV sẵn sàng. Dữ liệu lưu ngay trên máy này.'};
  if(cv instanceof Promise)cv.then(m=>{cv=m;up()});else if(cv.Mat)up();else cv.onRuntimeInitialized=up;
}

/* ============ 1. MẪU PHIẾU (TỌA ĐỘ LƯỚI) ============
 Tọa độ ĐO TRỰC TIẾP trên ảnh phiếu thật (556×794 px) bằng cách dò tâm từng bong bóng.
 fid = tâm 4 ô vuông đen ở 4 góc phiếu, thứ tự TL,TR,BR,BL. Ma trận phối cảnh ánh xạ 4 điểm này
 sang fid×S, nên mọi tọa độ bên dưới (đơn vị px phiếu gốc) chỉ cần nhân với S.
 g(phần, câu, cột/ý, x0, y0, số ô, bước dx, bước dy, nhãn, [chỉ số ô không in trên phiếu]) */
const DG='0123456789',S0=1.5;
const TPL={
  A:{name:'Phiếu Bộ GD-ĐT 2026 (40 TN + 8 Đ/S + 6 TLN)',S:S0,W:Math.round(556*S0),H:Math.round(794*S0),h:4,
    fid:[[18,15],[541,14],[541,770],[18,770]],n1:40,n2:8,n3:6,
    build(g){
      for(let k=0;k<8;k++)g('sbd',0,k,389.6+k*10.65,90.3,10,0,15.63,DG);   // SBD: 8 cột, hàng 0-9
      for(let k=0;k<4;k++)g('made',0,k,486.2+k*10.75,90.3,10,0,15.63,DG);  // Mã đề: 4 cột
      // Phần I: 4 khối × 10 câu, mỗi câu 4 ô A-D
      for(let i=0;i<40;i++)g('p1',i,0,[59.9,185.5,311.1,436.6][(i/10)|0],290.9+(i%10)*13.4,4,22.23,0,'ABCD');
      // Phần II: 8 câu, mỗi câu 4 ý (a-d) × 2 ô Đúng/Sai
      const X2=[59.8,104.5,185,229.8,311,355.8,436.5,480.8];
      for(let q=0;q<8;q++)for(let k=0;k<4;k++)g('p2',q,k,X2[q],479.1+k*13.4,2,22.3,0,'DS');
      // Phần III: 6 câu × 4 cột; hàng: '-', ',', 0..9. Dấu '-' chỉ ở cột 1; dấu ',' chỉ ở cột 2, 3
      for(let q=0;q<6;q++)for(let k=0;k<4;k++)g('p3',q,k,56.5+q*80.2+k*13.47,579.7,12,0,14.92,'-,'+DG,[[1],[0],[0],[0,1]][k]);
    }},
  B:{name:'Phiếu ngang 40 câu (CHƯA hiệu chỉnh)',S:1,W:990,H:700,h:5,fid:[[30,30],[960,30],[960,670],[30,670]],n1:40,n2:0,n3:0,
    build(g){
      for(let k=0;k<6;k++)g('sbd',0,k,50+k*28,60,10,0,20,DG);
      for(let k=0;k<3;k++)g('made',0,k,260+k*28,60,10,0,20,DG);
      for(let i=0;i<40;i++)g('p1',i,0,60+((i/10)|0)*230,330+(i%10)*26,4,36,0,'ABCD');
    }}
};
const cur=()=>TPL[$('#tpl').value];
function groups(t){
  const G=[];
  t.build((sec,q,k,x,y,n,dx,dy,lb,skip=[])=>G.push({sec,q,k,lb,pts:Array.from({length:n},(_,i)=>skip.includes(i)?null:[(x+i*dx)*t.S,(y+i*dy)*t.S])}));
  return G;
}

/* ============ 2. XỬ LÝ ẢNH OPENCV ============ */
function omr(src,t){
  const T=[],mk=o=>(T.push(o),o);   // gom Mat để giải phóng bộ nhớ ở finally
  try{
    const m=mk(cv.imread(src)),g=mk(new cv.Mat()),th=mk(new cv.Mat()),cs=mk(new cv.MatVector()),hi=mk(new cv.Mat());
    // (a) Xám -> Gaussian Blur -> nhị phân hóa thích nghi (chịu được bóng đổ) để tìm ô vuông đen ở 4 góc
    cv.cvtColor(m,g,cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(g,g,new cv.Size(5,5),0);
    cv.adaptiveThreshold(g,th,255,cv.ADAPTIVE_THRESH_GAUSSIAN_C,cv.THRESH_BINARY_INV,75,12);
    cv.findContours(th,cs,hi,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);
    // (b) Lọc contour: diện tích vừa phải, gần vuông, đặc (diện tích/hình chữ nhật bao > 0.75)
    const A=m.cols*m.rows,c=[];
    for(let i=0;i<cs.size();i++){
      const k=mk(cs.get(i)),a=cv.contourArea(k),r=cv.boundingRect(k),ar=r.width/r.height;
      if(a>A*1e-4&&a<A*.01&&ar>.7&&ar<1.4&&a/(r.width*r.height)>.75)c.push([r.x+r.width/2,r.y+r.height/2]);
    }
    if(c.length<4)throw new Error('Không thấy đủ 4 ô vuông đen ở góc phiếu. Chụp thẳng, đủ sáng, lấy trọn phiếu.');
    // (c) Chọn 4 góc theo cực trị: TL = min(x+y), BR = max(x+y), TR = max(x-y), BL = min(x-y)
    const f=[c.reduce((a,b)=>a[0]+a[1]<b[0]+b[1]?a:b),c.reduce((a,b)=>a[0]-a[1]>b[0]-b[1]?a:b),
             c.reduce((a,b)=>a[0]+a[1]>b[0]+b[1]?a:b),c.reduce((a,b)=>a[0]-a[1]<b[0]-b[1]?a:b)];
    // (d) Ma trận phối cảnh 3×3: ánh xạ 4 điểm ảnh gốc (s) -> 4 điểm chuẩn của phiếu (d), thứ tự TL,TR,BR,BL
    const s=mk(cv.matFromArray(4,1,cv.CV_32FC2,f.flat()));
    const d=mk(cv.matFromArray(4,1,cv.CV_32FC2,t.fid.flat().map(v=>v*t.S)));
    const Hm=mk(cv.getPerspectiveTransform(s,d)),w=mk(new cv.Mat());
    cv.warpPerspective(m,w,Hm,new cv.Size(t.W,t.H),cv.INTER_LINEAR,cv.BORDER_REPLICATE);
    // (e) Trên ảnh đã nắn thẳng: xám -> blur -> nhị phân (mực = 255)
    cv.cvtColor(w,g,cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(g,g,new cv.Size(5,5),0);
    cv.adaptiveThreshold(g,th,255,cv.ADAPTIVE_THRESH_GAUSSIAN_C,cv.THRESH_BINARY_INV,41,12);
    cv.imshow('out',w);
    // (f) Chia lưới: mỗi bong bóng là ô vuông (2h+1)² quanh tâm; tỉ lệ = số pixel đen / diện tích ô.
    //     Ô nhỏ hơn đường viền in sẵn của bong bóng nên chỉ ô thật sự bị tô mới có tỉ lệ cao.
    const h=t.h,AR=(2*h+1)**2,G=groups(t);
    for(const q of G){
      q.r=q.pts.map(p=>{if(!p)return 0;const[x,y]=p;
        const X=Math.round(x+cfg.ox-h),Y=Math.round(y+cfg.oy-h);
        if(X<0||Y<0||X+2*h+1>t.W||Y+2*h+1>t.H)return 0;
        const roi=th.roi(new cv.Rect(X,Y,2*h+1,2*h+1)),v=cv.countNonZero(roi)/AR;roi.delete();return v;
      });
      const mx=Math.max(...q.r);
      // ô được coi là "đã tô" nếu vượt ngưỡng và không quá yếu so với ô đậm nhất (loại vết bẩn)
      q.m=q.r.map((v,i)=>v>=cfg.fill&&v>=.7*mx?i:-1).filter(i=>i>=0);
      q.v=q.m.length==0?'':q.m.length==1?q.lb[q.m[0]]:'*';   // ''=bỏ trống, '*'=tô đúp
    }
    // (g) Gom kết quả theo phần
    const r={sbd:[],made:[],p1:Array(t.n1).fill(''),p2:Array.from({length:t.n2},()=>[]),p3:Array(t.n3).fill('')};
    for(const q of G){
      if(q.sec=='sbd'||q.sec=='made')r[q.sec][q.k]=q.v===''||q.v=='*'?'?':q.v;
      else if(q.sec=='p1')r.p1[q.q]=q.v;
      else if(q.sec=='p2')r.p2[q.q][q.k]=q.v;
      else r.p3[q.q]+=q.v===''?' ':q.v;
    }
    r.sbd=r.sbd.join('');r.made=r.made.join('');
    return{r,G};
  }finally{T.forEach(o=>{try{o.delete()}catch{}})}
}

/* ============ 3. CHẤM ĐIỂM (thang điểm 2026) ============
 Phần I: 0,25đ/câu. Phần II: đúng 1/2/3/4 ý = 0,1/0,25/0,5/1,0đ. Phần III: 0,5đ/câu. Phiếu 40 câu: 0,25đ/câu. */
function grade(r,key,t){
  if(!key)return null;
  const ok={},p=[0,0,0];
  for(let i=0;i<t.n1;i++){const o=!!key.p1[i]&&r.p1[i]===key.p1[i];ok[`p1|${i}|0`]=o;if(o)p[0]+=.25}
  for(let q=0;q<t.n2;q++){let c=0;
    for(let k=0;k<4;k++){const b=(key.p2[q]||'')[k],o=!!b&&r.p2[q][k]===b;ok[`p2|${q}|${k}`]=o;c+=o}
    p[1]+=[0,.1,.25,.5,1][c]}
  for(let q=0;q<t.n3;q++){
    const a=r.p3[q].replace(/ /g,''),b=(key.p3[q]||'').replace(/ /g,''),o=!!b&&a===b;
    for(let k=0;k<4;k++)ok[`p3|${q}|${k}`]=o;if(o)p[2]+=.5}
  const f=x=>Math.round(x*100)/100;
  return{ok,p:p.map(f),total:f(p[0]+p[1]+p[2])};
}

/* ============ 4. VẼ OVERLAY LÊN ẢNH ============ */
function draw(G,res,key,t){
  const x=$('#out').getContext('2d'),ring=(p,c,rad)=>{x.beginPath();x.arc(p[0]+cfg.ox,p[1]+cfg.oy,rad,0,7);x.strokeStyle=c;x.lineWidth=3;x.stroke()};
  for(const q of G){
    q.pts.forEach(p=>{if(!p)return;x.beginPath();x.arc(p[0]+cfg.ox,p[1]+cfg.oy,2,0,7);x.fillStyle='rgba(100,116,139,.7)';x.fill()}); // chấm xám = lưới
    const gr=res&&['p1','p2','p3'].includes(q.sec),o=gr&&res.ok[`${q.sec}|${q.q}|${q.k}`];
    q.m.forEach(i=>ring(q.pts[i],!gr?'#2563eb':o?'#16a34a':'#dc2626',6.5*t.S));
    const kc=gr&&(q.sec=='p1'?key.p1[q.q]:q.sec=='p2'?(key.p2[q.q]||'')[q.k]:'');
    if(kc&&!o){const i=q.lb.indexOf(kc);if(i>=0)ring(q.pts[i],'#2563eb',6.5*t.S)}   // vòng xanh = đáp án đúng bị bỏ sót
  }
  if(res){x.font=`bold ${22*t.S}px sans-serif`;x.fillStyle='#dc2626';x.fillText(`${res.total}/10`,24*t.S,52*t.S)}
}

/* ============ 5. ĐIỀU KHIỂN: CAMERA, ẢNH, CHẤM ============ */
async function cam(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920}},audio:false});
    $('#vid').srcObject=stream;$('#cbox').hidden=false;
  }catch(e){toast('Không mở được camera (cần HTTPS và cấp quyền). Hãy dùng "Chọn ảnh".')}
}
function snap(){
  const v=$('#vid'),c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);stream.getTracks().forEach(t=>t.stop());$('#cbox').hidden=true;run(c);
}
function loadFile(f){
  if(!f)return;const im=new Image();
  im.onload=()=>{const s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(im.src);run(c)};
  im.src=URL.createObjectURL(f);
}
function run(c){
  if(!ready)return toast('OpenCV còn đang tải, vui lòng đợi giây lát.');
  last=c;const id=$('#tpl').value,t=cur(),mode=$('#mode').value;
  let o;try{o=omr(c,t)}catch(e){return toast(e.message||'Lỗi xử lý ảnh')}
  const{r,G}=o;$('#out').hidden=false;
  if(mode=='master'){
    draw(G,null,null,t);
    const k={p1:r.p1.map(v=>v.length==1&&v!='*'?v:'-').join('').replace(/-+$/,'')};
    if(t.n2){k.p2=r.p2.map(a=>a.map(v=>v=='D'||v=='S'?v:'-').join(''));while(k.p2.length&&k.p2[k.p2.length-1]=='----')k.p2.pop()}
    if(t.n3){k.p3=r.p3.map(s=>s.replace(/ /g,''));while(k.p3.length&&!k.p3[k.p3.length-1])k.p3.pop()}
    keys[id+'|'+r.made]=k;S('keys',keys);
    $('#sum').hidden=false;$('#sum').innerHTML=`Đã lưu đáp án chuẩn cho mã đề <b>${r.made}</b>. Ô "-" là câu chưa đọc được, hãy kiểm tra ở tab Đáp án.`;
    return toast('Đã lưu đáp án chuẩn');
  }
  const key=keys[id+'|'+r.made],res=grade(r,key,t);
  draw(G,res,key,t);
  const n1=key?key.p1.length:0,n2=key&&key.p2?key.p2.length:0,blank=G.filter(q=>(q.sec=='p1'&&q.q<n1||q.sec=='p2'&&q.q<n2)&&q.v==='').length,multi=G.filter(q=>q.v=='*').length;
  const warn=[blank&&`${blank} ô bỏ trống`,multi&&`${multi} nhóm tô đúp`,r.sbd.includes('?')&&'SBD thiếu/lỗi',r.made.includes('?')&&'Mã đề lỗi',!key&&'Chưa có đáp án mã đề này'].filter(Boolean).join('; ');
  $('#sum').hidden=false;
  $('#sum').innerHTML=`SBD <b>${r.sbd}</b> · Mã đề <b>${r.made}</b><div class="text-3xl font-bold text-indigo-700">${res?res.total+'/10':'Chưa chấm'}</div>`+
    (res?`<div class="text-sm">Phần I: ${res.p[0]} · Phần II: ${res.p[1]} · Phần III: ${res.p[2]}</div>`:'')+(warn?`<div class="text-sm text-amber-600">${warn}</div>`:'');
  if(mode=='grade'){
    results.push({id:Date.now(),t:new Date().toLocaleString('vi-VN'),tpl:id,sbd:r.sbd,made:r.made,read:r,p:res?res.p:null,total:res?res.total:null,warn});
    S('res',results);
  }
}

/* ============ 6. ĐÁP ÁN ============ */
function saveKey(){
  const id=$('#tpl').value,t=cur(),md=$('#kmd').value.trim().padStart(3,'0');
  const p1=$('#k1').value.toUpperCase().replace(/[^A-D]/g,'');
  if(!p1.length||p1.length>t.n1)return toast(`Phần I cần 1-${t.n1} ký tự A-D`);
  const k={p1};
  if(t.n2){k.p2=$('#k2').value.toUpperCase().replace(/Đ/g,'D').split(/[\s,]+/).filter(Boolean);
    if(k.p2.length>t.n2||k.p2.some(s=>!/^[DS]{4}$/.test(s)))return toast(`Phần II tối đa ${t.n2} nhóm, mỗi nhóm 4 ký tự D/S (Đ=D)`)}
  if(t.n3){k.p3=$('#k3').value.trim().split(/\s+/).filter(Boolean).map(s=>s.replace('.',','));
    if(k.p3.length>t.n3)return toast(`Phần III tối đa ${t.n3} đáp án`)}
  keys[id+'|'+md]=k;S('keys',keys);renderKeys();toast('Đã lưu đáp án mã đề '+md);
}
function renderKeys(){
  const id=$('#tpl').value,t=cur();
  $('#l1').textContent=`Phần I: tối đa ${t.n1} đáp án A-D viết liền`;$('#w2').hidden=!t.n2;$('#w3').hidden=!t.n3;
  $('#kl').innerHTML=Object.keys(keys).filter(k=>k.startsWith(id+'|')).map(k=>
    `<div class="bg-white rounded-xl p-3 flex items-center gap-2 shadow"><button class="flex-1 text-left" onclick="loadKey('${k}')">Mã đề <b>${k.split('|')[1]}</b><br><span class="text-xs text-slate-500 break-all">${keys[k].p1}</span></button><button class="text-rose-600 p-2" onclick="delete keys['${k}'];S('keys',keys);renderKeys()">✕</button></div>`).join('')||'<p class="text-center text-slate-500">Chưa có đáp án nào</p>';
}
function loadKey(k){const v=keys[k];$('#kmd').value=k.split('|')[1];$('#k1').value=v.p1;$('#k2').value=(v.p2||[]).join(' ');$('#k3').value=(v.p3||[]).join(' ')}

/* ============ 7. KẾT QUẢ & XUẤT EXCEL ============ */
function renderRes(){
  $('#rl').innerHTML=results.map((r,i)=>`<div class="bg-white rounded-xl p-3 flex items-center gap-2 shadow"><span class="w-5 text-slate-400 text-sm">${i+1}</span><input value="${r.sbd}" onchange="results[${i}].sbd=this.value;S('res',results)" class="I" style="width:6.5rem" inputmode="numeric"><span class="text-sm flex-1">MĐ ${r.made}<br><span class="text-xs text-amber-600">${r.warn||''}</span></span><b class="text-lg text-indigo-700">${r.total??'—'}</b><button onclick="results.splice(${i},1);S('res',results);renderRes()" class="text-rose-600 p-2">✕</button></div>`).join('')||'<p class="text-center text-slate-500">Chưa có bài nào được chấm</p>';
}
function regrade(){
  results.forEach(r=>{const g=grade(r.read,keys[r.tpl+'|'+r.made],TPL[r.tpl]);r.p=g?g.p:null;r.total=g?g.total:null;if(g)r.warn=(r.warn||'').replace(/;? ?Chưa có đáp án mã đề này/,'')});
  S('res',results);renderRes();toast('Đã chấm lại');
}
function exp(){
  if(!results.length)return toast('Chưa có kết quả để xuất');
  const rows=[['STT','SBD','Mã đề','Điểm phần I','Điểm phần II','Điểm phần III','Tổng điểm','Cảnh báo','Thời gian']];
  results.forEach((r,i)=>rows.push([i+1,r.sbd,r.made,...(r.p||['','','']),r.total??'',r.warn||'',r.t]));
  const ws=XLSX.utils.aoa_to_sheet(rows),wb=XLSX.utils.book_new();
  ws['!cols']=[6,12,8,12,12,12,10,30,20].map(wch=>({wch}));
  XLSX.utils.book_append_sheet(wb,ws,'KetQua');XLSX.writeFile(wb,'KetQuaChamThi.xlsx');
}

/* ============ 8. KHỞI TẠO GIAO DIỆN ============ */
const TABS=[['scan','Chấm bài'],['key','Đáp án'],['res','Kết quả']];
function tab(n){
  TABS.forEach(([i])=>{$('#'+i).hidden=i!=n;$(`[data-t=${i}]`).className='B '+(i==n?'bg-indigo-600':'bg-slate-400')});
  if(n=='res')renderRes();if(n=='key')renderKeys();
}
$('#nav').innerHTML=TABS.map(([i,l])=>`<button data-t="${i}" onclick="tab('${i}')">${l}</button>`).join('');
$('#tpl').innerHTML=Object.keys(TPL).map(k=>`<option value="${k}">${TPL[k].name}</option>`).join('');
[['fill','vfill'],['ox'],['oy']].forEach(([k,v])=>{const e=$('#c'+k);e.value=cfg[k];if(v)$('#'+v).textContent=cfg[k];
  e.oninput=()=>{cfg[k]=+e.value;S('cfg',cfg);if(v)$('#'+v).textContent=cfg[k]}});
tab('scan');
</script>
</body>
</html>
